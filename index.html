<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>브레인라이팅</title>
<style>
:root{--bg:#f3f1f4;--card:#fff;--ink:#2d2a32;--mute:#8e8996;--line:#e3dfe8;--p:#9d88b8;--pd:#76628f;--pk:#ecc9d8;--pl:#efe8f4}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}.logo i{width:18px;height:18px;background:var(--p);border-radius:5px;display:inline-block;box-shadow:6px 6px 0 var(--pk)}
header button{padding:5px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.topic{background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px}.topic small{color:#bdb6c9;display:block}.topic b{font-size:20px}.topic .chip{background:var(--pk);color:var(--ink)}
.steps{margin-top:6px}.steps span{font-size:12px;opacity:.45;margin-right:10px}.steps .on{opacity:1;font-weight:800;color:var(--pk)}
h2{font-size:20px;margin-bottom:10px}h3{font-size:15px;margin:4px 0 8px}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:700}
button.pri{background:var(--p);border-color:var(--pd);color:#fff}button.pk{background:var(--pk);border-color:#c79ab0}
button.ghost{border-color:var(--line);color:var(--mute)}button:active{transform:translateY(1px)}
button.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:8px}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row.nf>*{flex:none}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big button{padding:26px 10px;font-size:17px}
.chip{display:inline-block;background:var(--pl);color:var(--pd);border-radius:20px;padding:5px 12px;margin:3px;font-weight:700;font-size:14px}
.mute{color:var(--mute);font-size:14px}.err{color:#b4506f;font-size:14px;min-height:20px}
.timer{font-size:40px;font-weight:800;color:var(--pd);text-align:center}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;background:var(--p)}
.prev{background:var(--pl);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;overflow:hidden}.prev u{text-decoration:none;font-weight:700;color:var(--pd)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border-color:var(--line);padding:9px 4px}.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid var(--line);cursor:pointer}
.chat{height:340px;overflow:auto;background:var(--pl);border-radius:12px;padding:10px;margin-bottom:8px}.chat p{margin-bottom:8px;font-size:15px}
.modal{position:fixed;inset:0;background:#2d2a3299;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}.modal .card{max-width:480px;max-height:85vh;overflow:auto;margin:0;width:100%}
.modal li{margin:0 0 8px 18px;font-size:15px}
.pick span{display:inline-block;font-size:26px;padding:4px 8px;border-radius:12px;cursor:pointer;border:2px solid transparent}.pick span.on{border-color:var(--pd);background:var(--pl)}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px solid var(--line)}.task input{width:20px;margin:0;flex:none}.task button{margin-left:auto;padding:2px 8px;font-size:13px}.done{text-decoration:line-through;color:var(--mute)}
.stats{display:flex;gap:8px;margin-bottom:14px}.stat{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}.stat b{display:block;font-size:22px;color:var(--pd)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.note{background:var(--pl);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;word-break:break-word}.note.pick{background:var(--pk)}
.note .nf{display:flex;justify-content:space-between;align-items:center;gap:6px}.note small{color:var(--mute)}.note button{padding:1px 7px;font-size:12px;margin-left:3px}
.rd{border-left:4px solid var(--p);padding-left:10px;margin:10px 0}.rh{font-size:13px;color:var(--mute);margin-bottom:4px}.rh b{background:var(--p);color:#fff;border-radius:8px;padding:1px 7px;margin-right:6px}
.it{background:var(--pl);border-radius:10px;padding:7px 10px;margin:4px 0;font-size:14px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:6px;border-color:var(--line)}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.gg button{height:70px;font-size:30px;padding:0;border-color:var(--line);background:var(--pl)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:20;font-weight:700;max-width:90vw;text-align:center}
#sl{width:100%;border:2px solid var(--line);border-radius:12px;background:#fff;display:block}
@media(max-width:520px){.big{grid-template-columns:1fr}.timer{font-size:34px}}
</style></head><body>
<header><div class="logo"><i></i>브레인라이팅</div><div class="row nf"><button class="ghost" id="mn" style="display:none">⋯ 메뉴</button><button class="ghost" id="more">더보기</button><button class="ghost" id="out" style="display:none">로그아웃</button></div></header>
<main id="main"></main>
<script>setTimeout(function(){var m=document.getElementById('main');if(!m.innerHTML.trim())m.innerHTML='<div class=card><h2>화면이 안 뜨네?</h2><p>파일을 더블클릭해서 열면 Firebase가 막혀. 버셀 주소(또는 로컬 서버)로 열고, firebaseConfig도 확인해줘.</p></div>'},2500)</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,orderBy,onSnapshot,getDocs,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBxtSHYNZcYX6YXrxIwJHQFaJ7wnBGK_Us",authDomain:"rainbowddong.firebaseapp.com",projectId:"rainbowddong",appId:"1:989874678291:web:fa49bdafb7ce8effa26de6"};

const app0=initializeApp(firebaseConfig),auth=getAuth(app0),db=getFirestore(app0);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONS=['🙂','🦊','🐱','🐻','🐰','🌷','🍀','⭐'],COLORS=['#9d88b8','#d48aa8','#8e8996','#76628f','#c79ab0','#5f5a66'];
let U=null,code=null,R=null,ideas=[],chats=[],tasks=[],slides=[],sigs=[],sigsInit=0,lastDk='',pres={},unsubs=[],viewKey='',tab='ideas',timerI=null,beatI=null,curWrite=null,hist=[],fired={},saveT=null,P={icon:'🙂',color:'#9d88b8'},vs=0,bwv='sheet',dr={title:'',mode:'bw',min:5,count:3,rounds:5,anon:false};
const page=h=>{$('#main').innerHTML=h};
const rref=()=>doc(db,'rooms',code),col=n=>collection(db,'rooms',code,n);
const SID=()=>R.sid||0,VS=()=>vs||SID(),sd=d=>d.sid||0;
const PT=()=>R.parts||R.members;
const ptsOf=S=>(R.meets&&R.meets[S]&&R.meets[S].parts)||R.members;
const an=S=>R.meets&&R.meets[S]&&R.meets[S].anon!==undefined?R.meets[S].anon:R.settings.anon;
const nmS=(S,n)=>an(S)?'익명':n;
const nm=n=>nmS(SID(),n);
const mdOf=S=>(R.meets&&R.meets[S]&&R.meets[S].mode)||R.mode;
const mName=m=>m==='bs'?'브레인스토밍':'브레인라이팅';
const me=()=>({uid:U.uid,name:U.displayName||'이름없음',icon:P.icon,color:P.color});
const isOn=m=>pres[m.uid]&&Date.now()-pres[m.uid].t<40000;
const chip=m=>`<span class=chip style="background:${m.color||'#9d88b8'}33"><span>${m.icon||''}</span> ${e(m.name)}${R&&m.uid===R.host?' 👑':''}</span>`;
const pchip=m=>`<span class=chip style="background:${m.color||'#9d88b8'}33;opacity:${isOn(m)?1:.5}">${isOn(m)?'🟢':'⚪'} ${m.icon||''} ${e(m.name)}${R&&m.uid===R.host?' 👑':''}</span>`;
const PR=['비판 보류','질보다 양','자유로운 분위기','결합·개선'];
const STEPS=['준비','생성','토론·분류','선택'];
const isHost=()=>R&&R.host===U.uid;
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),4000)};
const top=()=>{const m=R.status==='write';return`<div class=topic><small>${e(R.team||R.title)}${m?' · 주제':' · 팀 코드 '+code}</small><b>${m?e(R.title):e(R.team||R.title)}</b>${m?` <span class=chip>${mName(R.mode)}</span>`:''}${m&&R.mode==='bs'?`<div class=steps>${STEPS.map((s,i)=>`<span class="${i===1?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`:''}<div id=on class=mute style="color:#bdb6c9"></div></div>`};
const partsCard=()=>`<div class=card><h3>지금 회의 참가자</h3><div id=pp></div></div>`;

$('#more').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class=card><h2>이 서비스는?</h2><p class=mute>모둠 회의에서 정적이 흐를 때, 아이디어 내기 절차를 차근차근 안내해줘요.</p><br><h3>팀</h3><ol><li>방장이 팀을 만들고 코드를 공유해요.</li><li>팀원이 코드로 들어오면 팀 안에서 채팅, 업무, 발표, 회의를 함께 해요.</li><li>방장이 회의를 시작하면, 그때 팀 페이지에 접속 중인 팀원이 자동으로 참가해요.</li></ol><h3>브레인라이팅</h3><ol><li>정해진 시간 동안 아이디어를 적어요. 대화 금지!</li><li>시간이 끝나면 내 시트가 옆 사람에게 넘어가요.</li><li>정해진 횟수만큼 돌리면 회의가 끝나고 결과가 정리돼요.</li></ol><h3>브레인스토밍</h3><ol><li>준비: 주제·목표를 정하고 4대 원칙을 확인해요.</li><li>생성: 비판 없이, 양 위주로, 자유롭게, 서로의 아이디어를 결합해요.</li><li>토론·분류: 회의가 끝난 뒤 결과 화면에서 '분류'로 묶고 ♥ 투표해요.</li><li>선택: 방장이 ★로 최종안을 채택해요.</li></ol><br><p class=mute>시간이 모자라면 ⏰, 다 썼으면 ⏭ 버튼으로 팀에게 알려요. 모든 기록은 팀에 남고, 오른쪽 위 ⋯ 메뉴에서 txt로 저장할 수 있어요.</p><br><button class=pri id=x style="width:100%">닫기</button></div>`;document.body.append(m);m.onclick=ev=>{if(ev.target===m||ev.target.id==='x')m.remove()}};
$('#out').onclick=()=>signOut(auth);
$('#mn').onclick=()=>{if(!R)return;const h=isHost(),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class=card><h2>메뉴</h2><div style="display:grid;gap:8px"><button id=m1>⬇ 회의 기록 저장</button><button id=m2>🏠 홈으로</button>${h&&R.status==='write'?'<button class=pk id=m3>현재 회의 종료</button>':''}<button class=ghost id=m4>팀 나가기</button><button class=ghost id=m5>닫기</button></div></div>`;document.body.append(m);
m.onclick=ev=>{if(ev.target===m)m.remove()};$('#m5').onclick=()=>m.remove();
$('#m1').onclick=()=>{m.remove();download()};$('#m2').onclick=()=>{m.remove();leave()};$('#m4').onclick=()=>{m.remove();exitRoom()};
if($('#m3'))$('#m3').onclick=()=>{m.remove();if(confirm('현재 회의를 지금 종료할까? 기록은 그대로 남아.'))updateDoc(rref(),{status:'lobby'})}};
const showErr=m=>{$('#main').innerHTML=`<div class=card><h2>앗, 오류가 났어</h2><p class=err style="white-space:pre-wrap">${e(m)}</p></div>`};
window.addEventListener('unhandledrejection',x=>showErr(x.reason?.message||x.reason));
document.addEventListener('keydown',ev=>{if(tab!=='board'||!R||R.status==='write'||!canCtl())return;if(ev.key==='ArrowRight')go(1);if(ev.key==='ArrowLeft')go(-1)});
setTimeout(()=>{if(!U&&!code)authView()},0);

/* 인증 */
onAuthStateChanged(auth,async u=>{U=u;$('#out').style.display=u?'':'none';if(u)await loadHist();view()});
function view(){if(!U)return authView();if(!code)return home();roomRender()}
function authView(){let mode='in';const draw=()=>{page(`<div class=card><h2>${mode==='in'?'로그인':'회원가입'}</h2>${mode==='up'?'<input id=nm placeholder="이름(팀에 표시돼요)">':''}<input id=em type=email placeholder="이메일"><input id=pw type=password placeholder="비밀번호(6자 이상)"><div class=err id=er></div><button class=pri id=go style="width:100%">${mode==='in'?'로그인':'가입하기'}</button><button id=gg style="width:100%;margin-top:8px">Google로 계속하기</button><p class=mute style="margin-top:12px;text-align:center"><a href=# id=sw style="color:var(--pd)">${mode==='in'?'처음이라면 회원가입':'이미 계정이 있어요'}</a></p></div>`);
$('#sw').onclick=ev=>{ev.preventDefault();mode=mode==='in'?'up':'in';draw()};
$('#gg').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){$('#er').textContent=x.message.replace('Firebase: ','')}};
$('#go').onclick=async()=>{try{if(mode==='in')await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value);else{const n=$('#nm').value.trim();if(!n)throw{message:'이름을 입력해줘'};const c=await createUserWithEmailAndPassword(auth,$('#em').value,$('#pw').value);await updateProfile(c.user,{displayName:n});U=auth.currentUser;await loadHist();view()}}catch(x){$('#er').textContent=x.message.replace('Firebase: ','')}}};draw()}

/* 홈 */
async function loadHist(){try{const u=await getDoc(doc(db,'users',U.uid));if(u.exists())P={...P,...u.data()}}catch(x){}
try{const s=await getDocs(query(collection(db,'rooms'),where('memberIds','array-contains',U.uid)));hist=s.docs.map(d=>({code:d.id,...d.data()})).sort((a,b)=>b.created-a.created)}catch(x){hist=[]}}
function home(){page(`<div class=card><div class=row><h2>${P.icon} 안녕, ${e(U.displayName||'')}</h2><button class=ghost id=pf style="flex:none">프로필</button></div><div class=big><button class=pri id=mk>팀 만들기</button><button id=jn>팀 입장하기</button></div><div id=box style="margin-top:12px"></div></div><div class=card><h3>내 팀</h3>${hist.length?hist.map(h=>`<div class=hist data-c="${h.code}"><div><b>${e(h.team||h.title)}</b><div class=mute>${new Date(h.created).toLocaleDateString('ko-KR')} · ${h.code} · ${h.memberIds.length}명 · 회의 ${h.sid||0}회</div></div><span class=chip>${h.status==='write'?'회의 중':'대기'}</span></div>`).join(''):'<p class=mute>아직 참여한 팀이 없어요.</p>'}</div>`);
$$('.hist').forEach(h=>h.onclick=()=>enter(h.dataset.c));$('#pf').onclick=profile;
$('#mk').onclick=()=>{$('#box').innerHTML='<input id=ti placeholder="팀 이름"><button class=pri id=ok style="width:100%">만들기</button>';$('#ok').onclick=create};
$('#jn').onclick=()=>{$('#box').innerHTML='<input id=cd placeholder="팀 코드 6자리" maxlength=6 style="text-transform:uppercase"><div class=err id=er></div><button class=pri id=ok style="width:100%">입장</button>';$('#ok').onclick=join}}
function profile(){const m=document.createElement('div');m.className='modal';let ic=P.icon,cl=P.color;m.innerHTML=`<div class=card><h2>내 프로필</h2><input id=pn value="${e(U.displayName||'')}" placeholder="이름"><h3>아이콘</h3><div class=pick id=pi>${ICONS.map(i=>`<span data-i=${i} class="${i===ic?'on':''}">${i}</span>`).join('')}</div><h3>대표 색</h3><div class=pick id=pc>${COLORS.map(c=>`<span data-c=${c} class="${c===cl?'on':''}" style="background:${c};width:34px;height:34px;padding:0"></span>`).join('')}</div><br><button class=pri id=sv style="width:100%">저장</button></div>`;document.body.append(m);
const pick=(id,k,f)=>$$('#'+id+' span').forEach(s=>s.onclick=()=>{f(s.dataset[k]);$$('#'+id+' span').forEach(x=>x.classList.toggle('on',x===s))});pick('pi','i',v=>ic=v);pick('pc','c',v=>cl=v);
m.onclick=ev=>{if(ev.target===m)m.remove()};
$('#sv').onclick=async()=>{const n=$('#pn').value.trim();if(n&&n!==U.displayName)await updateProfile(auth.currentUser,{displayName:n});P={icon:ic,color:cl};await setDoc(doc(db,'users',U.uid),P);m.remove();home()}}
async function create(){const c=Math.random().toString(36).slice(2,8).toUpperCase(),t=$('#ti').value.trim()||'우리 팀';
await setDoc(doc(db,'rooms',c),{team:t,title:'',mode:'bw',host:U.uid,status:'lobby',round:0,roundEnd:0,sid:0,meets:{},deck:null,created:Date.now(),settings:{min:5,count:3,rounds:5,anon:false},members:[me()],memberIds:[U.uid]});enter(c)}
async function join(){const c=$('#cd').value.trim().toUpperCase(),s=await getDoc(doc(db,'rooms',c||'-'));if(!s.exists())return $('#er').textContent='없는 코드야';const d=s.data();
if(!d.memberIds.includes(U.uid))await updateDoc(s.ref,{members:arrayUnion(me()),memberIds:arrayUnion(U.uid)});enter(c)}

/* 팀 */
function enter(c){code=c;R=null;ideas=[];chats=[];tasks=[];slides=[];sigs=[];sigsInit=0;lastDk='';pres={};viewKey='';tab='ideas';curWrite=null;fired={};vs=0;dr={title:'',mode:'bw',min:5,count:3,rounds:5,anon:false};$('#mn').style.display='';
unsubs=[onSnapshot(rref(),s=>{if(!s.exists())return leave();const nd=s.data();if(curWrite&&R&&R.status==='write'&&(nd.round!==R.round||nd.status!=='write'||nd.sid!==R.sid))saveDom();R=nd;roomRender();const dk=R.deck?R.deck.id:'';if(tab==='board'&&R.status!=='write'){dk!==lastDk?pane():slideUpdate()}lastDk=dk}),
onSnapshot(col('ideas'),s=>{ideas=s.docs.map(d=>({id:d.id,...d.data()}));if(!R)return;if(R.status==='write'){if(R.mode==='bs')feed();else{const p=$('#prev');if(p)p.innerHTML=prevHtml();const mine=ideas.find(d=>d.id===SID()+'_'+R.round+'_'+U.uid);if(mine)$$('.idea').forEach((t,i)=>{if(!t.value&&mine.items[i])t.value=mine.items[i]})}egg()}else if(tab==='ideas'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))pane()}),
onSnapshot(query(col('messages'),orderBy('t')),s=>{chats=s.docs.map(d=>d.data());if(tab==='chat')chatList()}),
onSnapshot(col('slides'),s=>{slides=s.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);slideUpdate()}),
onSnapshot(col('tasks'),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));if(tab==='team'&&R&&R.status!=='write')pane()}),

if(!d){p.innerHTML=`<div class=card><h3>🎤 발표하기</h3><p class=mute>PPT는 <b>PDF로 저장</b>(파일 → 내보내기 또는 다른 이름으로 저장 → PDF)해서 올려주세요. PDF 또는 이미지(PNG·JPG 여러 장)를 올릴 수 있고 최대 40장이에요. 올린 사람이 슬라이드를 넘기면 팀원 화면도 똑같이 넘어가요.</p><br><input type=file id=pf accept=".pdf,.ppt,.pptx,image/*" multiple><div class=err id=us></div></div>`;$('#pf').onchange=ev=>upload(ev.target.files);return}
const ctl=canCtl();
p.innerHTML=`<div class=card><div class=row><b>🎤 ${e(d.byName)} 발표 중</b><span id=sn class=mute style="text-align:right"></span></div><br><img id=sl alt="">${ctl?`<div class=row style="margin-top:10px"><button id=pv>◀ 이전</button><button class=pri id=nx>다음 ▶</button><button class=ghost id=en>발표 종료</button></div><p class=mute style="margin-top:6px">키보드 ← → 로도 넘길 수 있어요.</p>`:'<p class=mute style="margin-top:8px">발표자가 넘기면 자동으로 따라가요.</p>'}</div>`;
if(ctl){$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#en').onclick=endDeck}slideUpdate()}
function slideUpdate(){const im=$('#sl');if(!im||!R||!R.deck)return;const s=slides.find(x=>x.deck===R.deck.id&&x.i===R.deck.page);im.src=s?s.src:'';const n=$('#sn');if(n)n.textContent=(R.deck.page+1)+' / '+R.deck.n}
function go(d){if(!canCtl())return;const np=Math.max(0,Math.min(R.deck.n-1,R.deck.page+d));if(np!==R.deck.page)updateDoc(rref(),{'deck.page':np})}
async function endDeck(){if(!confirm('발표를 종료할까?'))return;(await getDocs(col('slides'))).forEach(d=>deleteDoc(d.ref));updateDoc(rref(),{deck:null})}
function loadPdf(){return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};s.onerror=()=>no(new Error('PDF 변환 도구를 불러오지 못했어'));document.head.append(s)})}
function shrink(c){let q=.6,u=c.toDataURL('image/jpeg',q);while(u.length>900000&&q>.2){q-=.1;u=c.toDataURL('image/jpeg',q)}return u}
function imgToUrl(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(shrink(c))};im.onerror=()=>no(new Error('이미지를 읽지 못했어'));im.src=URL.createObjectURL(f)})}
async function upload(files){const us=$('#us'),fl=[...files];if(!fl.length)return;
if(fl.some(f=>/\.pptx?$/i.test(f.name)))return us.textContent='PPT는 브라우저에서 바로 못 열어요. PDF로 저장해서 올려줘';
try{let pages=[];
if(fl[0].type==='application/pdf'){await loadPdf();const pdf=await pdfjsLib.getDocument({data:await fl[0].arrayBuffer()}).promise,n=Math.min(pdf.numPages,40);
for(let i=1;i<=n;i++){us.textContent=`변환 중 ${i}/${n}…`;const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1280/pg.getViewport({scale:1}).width}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push(shrink(c))}}
else{const im=fl.filter(f=>f.type.startsWith('image/')).slice(0,40);for(const f of im){us.textContent=`변환 중 ${pages.length+1}/${im.length}…`;pages.push(await imgToUrl(f))}}
if(!pages.length)return us.textContent='올릴 수 있는 파일이 없어';
us.textContent='올리는 중…';(await getDocs(col('slides'))).forEach(d=>deleteDoc(d.ref));
const id=String(Date.now());await Promise.all(pages.map((src,i)=>setDoc(doc(db,'rooms',code,'slides',id+'_'+String(i).padStart(2,'0')),{deck:id,i,src})));
await updateDoc(rref(),{deck:{id,n:pages.length,page:0,by:U.uid,byName:U.displayName||'이름없음'}})}catch(x){if($('#us'))$('#us').textContent=x.message||'업로드에 실패했어'}}

/* 팀 탭: 역할·업무 */
function team(p){const h=isHost();
p.innerHTML=`<div class=card><h3>역할 분배 · 팀 코드 ${code}</h3>${R.members.map((m,i)=>`<div class=row style="margin-bottom:6px">${chip(m)}${h?`<input data-r=${i} value="${e(m.role||'')}" placeholder="역할(예: 발표, 기록)" style="margin:0">`:`<span class=mute>${e(m.role||'역할 미정')}</span>`}</div>`).join('')}</div>
${h?`<div class=card><h3>업무 지시</h3><select id=ta>${R.members.map(m=>`<option value=${m.uid}>${e(m.name)}</option>`).join('')}</select><input id=tt2 placeholder="할 일"><input id=td type=date><button class=pri id=tb style="width:100%">지시하기</button></div>`:''}
<div class=card><h3>업무 목록</h3>${tasks.map(t=>{const mn=t.to===U.uid;return`<div class=task><input type=checkbox data-k=${t.id} ${t.done?'checked':''} ${mn||h?'':'disabled'}><div class="${t.done?'done':''}"><b>${e(t.title)}</b><div class=mute>${e(t.toName)}${t.due?' · 기한 '+t.due:''}${mn?' · 내 업무':''}</div></div>${h?`<button class=ghost data-del=${t.id}>삭제</button>`:''}</div>`}).join('')||'<p class=mute>아직 지시된 업무가 없어요.</p>'}</div>`;
$$('[data-r]').forEach(i=>i.onchange=()=>{const ms=R.members.map((m,k)=>k==i.dataset.r?{...m,role:i.value}:m);updateDoc(rref(),{members:ms})});
$$('[data-k]').forEach(c=>c.onchange=()=>updateDoc(doc(db,'rooms',code,'tasks',c.dataset.k),{done:c.checked}));
$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('이 업무를 삭제할까?'))deleteDoc(doc(db,'rooms',code,'tasks',b.dataset.del))});
if(h)$('#tb').onclick=()=>{const t=$('#tt2').value.trim();if(!t)return;const m=R.members.find(x=>x.uid===$('#ta').value);addDoc(col('tasks'),{title:t,to:m.uid,toName:m.name,due:$('#td').value,done:false,t:Date.now()})}}

function download(){const L=[`# ${R.team||R.title}`,`팀 코드: ${code}`,`생성: ${new Date(R.created).toLocaleString('ko-KR')}`,`팀원: ${R.members.map(m=>m.name+(m.role?'('+m.role+')':'')).join(', ')}`,''];
for(let S=1;S<=SID();S++){const mt=R.meets&&R.meets[S];L.push(`## ${S}차 회의: ${mt?mt.title:''} (${mName(mdOf(S))})`,`참가자: ${ptsOf(S).map(m=>an(S)?'익명':m.name).join(', ')}`,'');
if(mdOf(S)==='bs'){let g=null;bsList(S).sort((a,b)=>(a.g||'~').localeCompare(b.g||'~')).forEach(d=>{if(d.g!==g){g=d.g;L.push(`[${g||'미분류'}]`)}L.push(`- ${d.pick?'★ ':''}${nmS(S,d.name)}: ${d.text} (♥${(d.votes||[]).length})`)})}
else sheets(S).forEach(s=>{L.push('### '+s.title);s.list.forEach(d=>{L.push(`[라운드 ${d.round}] ${nmS(S,d.name)}`);d.items.filter(Boolean).forEach(t=>L.push('  - '+t))});L.push('')});
L.push('')}
L.push('## 업무','');tasks.forEach(t=>L.push(`- [${t.done?'x':' '}] ${t.title} → ${t.toName}${t.due?' (기한 '+t.due+')':''}`));
L.push('','## 채팅','');chats.forEach(m=>L.push(`${new Date(m.t).toLocaleString('ko-KR')} ${m.name}: ${m.text||''}${m.file?' (파일: '+m.file.name+')':''}`));
const b=new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`회의기록_${code}.txt`;document.body.append(a);a.click();a.remove()}
</script></body></html>
